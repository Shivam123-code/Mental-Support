<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Outer orbital ellipse - light lavender/purple -->
  <ellipse cx="100" cy="95" rx="92" ry="62" fill="none" stroke="#B8A4E8" stroke-width="3.5" stroke-linecap="round" transform="rotate(-12, 100, 95)"/>
  
  <!-- Gold/Orange accent arc on right side -->
  <path d="M 140 42 A 65 50 -10 0 1 178 88 A 65 50 -10 0 1 162 128" fill="none" stroke="#F5A623" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Orbital node dots -->
  <circle cx="52" cy="42" r="5.5" fill="#2D1B69"/>
  <circle cx="178" cy="88" r="4.5" fill="#F5A623"/>
  <circle cx="28" cy="108" r="4.5" fill="#B8A4E8"/>
  <circle cx="165" cy="132" r="4" fill="#B8A4E8"/>
  
  <!-- Meditation figure - deep purple -->
  <!-- Head -->
  <circle cx="100" cy="55" r="10" fill="none" stroke="#2D1B69" stroke-width="4.5"/>
  
  <!-- Body / torso - oval -->
  <ellipse cx="100" cy="88" rx="15" ry="19" fill="none" stroke="#2D1B69" stroke-width="4.5"/>
  
  <!-- Legs - trefoil/celtic knot crossing pattern -->
  <!-- Left leg loop -->
  <ellipse cx="87" cy="125" rx="15" ry="11" fill="none" stroke="#2D1B69" stroke-width="4" transform="rotate(-3, 87, 125)"/>
  <!-- Right leg loop -->
  <ellipse cx="113" cy="125" rx="15" ry="11" fill="none" stroke="#2D1B69" stroke-width="4" transform="rotate(3, 113, 125)"/>
  <!-- Center connection (where legs cross) -->
  <ellipse cx="100" cy="118" rx="9" ry="7" fill="none" stroke="#2D1B69" stroke-width="3.5"/>
</svg>
