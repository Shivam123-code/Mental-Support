  <!-- Gold arc -->
  <path d="M 130 55 A 55 55 0 0 1 160 105" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Orbital dots -->
  <circle cx="55" cy="55" r="6" fill="#2D1B69"/>
  <circle cx="160" cy="105" r="5" fill="#F5A623"/>
  <circle cx="40" cy="120" r="5" fill="#C4B5FD"/>
  <circle cx="155" cy="140" r="5" fill="#C4B5FD"/>
  
  <!-- Meditation figure - head -->
  <circle cx="100" cy="65" r="12" fill="none" stroke="#2D1B69" stroke-width="5"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="100" rx="18" ry="22" fill="none" stroke="#2D1B69" stroke-width="5"/>
  
  <!-- Crossed legs -->
  <path d="M 82 118 Q 85 140 100 140 Q 115 140 118 118" fill="none" stroke="#2D1B69" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="88" cy="138" rx="12" ry="8" fill="none" stroke="#2D1B69" stroke-width="4"/>
  <ellipse cx="112" cy="138" rx="12" ry="8" fill="none" stroke="#2D1B69" stroke-width="4"/>
</svg>
